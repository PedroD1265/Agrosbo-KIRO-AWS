services:
  postgres:
    image: postgres:15-alpine
    container_name: agrosbo-spike-a-db
    ports:
      - "54320:5432"
    environment:
      POSTGRES_DB: agrosbo_spike
      POSTGRES_USER: spike
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spike -d agrosbo_spike"]
      interval: 2s
      timeout: 5s
      retries: 10
